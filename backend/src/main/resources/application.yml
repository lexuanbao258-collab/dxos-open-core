spring:
  application:
    name: dxos-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: never

# Documentation endpoints are OFF by default, including production deployments.
# Enable only through the guarded docs-local profile (bound to loopback).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
