spring:
  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:11MB}
  application:
    name: dxos-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

dxos:
  attachments:
    storage-path: ${ATTACHMENT_STORAGE_PATH:${java.io.tmpdir}/dxos-attachments}
    max-file-size: ${ATTACHMENT_MAX_FILE_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: never
