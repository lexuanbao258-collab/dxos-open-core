spring:
  application:
    name: dxos-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: never
dxos:
  object-storage:
    provider: ${DXOS_OBJECT_STORAGE_PROVIDER:disabled}
    minio:
      endpoint: ${MINIO_STORAGE_ENDPOINT:}
      region: ${MINIO_STORAGE_REGION:us-east-1}
      access-key: ${MINIO_STORAGE_ACCESS_KEY:}
      secret-key: ${MINIO_STORAGE_SECRET_KEY:}
      bucket: ${MINIO_STORAGE_BUCKET:}
      key-prefix: ${MINIO_STORAGE_KEY_PREFIX:}
      max-object-bytes: ${MINIO_STORAGE_MAX_OBJECT_BYTES:67108864}
      max-metadata-bytes: ${MINIO_STORAGE_MAX_METADATA_BYTES:1800}
      max-key-bytes: ${MINIO_STORAGE_MAX_KEY_BYTES:1024}
      staging-directory: ${MINIO_STORAGE_STAGING_DIRECTORY:}
      connect-timeout: ${MINIO_STORAGE_CONNECT_TIMEOUT:PT10S}
      read-timeout: ${MINIO_STORAGE_READ_TIMEOUT:PT60S}
      request-timeout: ${MINIO_STORAGE_REQUEST_TIMEOUT:PT120S}
      allow-insecure-http: ${MINIO_STORAGE_ALLOW_INSECURE_HTTP:false}
