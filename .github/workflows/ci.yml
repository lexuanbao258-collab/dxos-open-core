#
# CI chung duy nhất của repo. Ba job dưới đây là "required status checks"
# trong branch protection của main: backend, frontend, repo-hygiene.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and unit tests
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ is not on this branch yet; nothing to build."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, build and test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

  repo-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore|ci|build)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must look like 'feat(workflow): add outbox event'. Got: $TITLE"
            exit 1
          fi
      - name: PR links an issue and stays small
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(closes|fixes|refs) #[0-9]+'; then
            echo "::warning::PR description has no 'Closes #N'. Link the issue it completes."
          fi
          total=$(( ${ADDITIONS:-0} + ${DELETIONS:-0} ))
          if [ "$total" -gt 400 ]; then
            echo "::warning::PR changes $total lines (limit 400, lockfiles included). Consider splitting it."
          fi
      - name: Gradle wrapper is executable
        run: |
          mode=$(git ls-files -s backend/gradlew | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::backend/gradlew must be committed as executable: git update-index --chmod=+x backend/gradlew"
            exit 1
          fi
      - name: REUSE licensing check
        # Không chặn merge cho tới khi PR LICENSE + SPDX của Issue #38 vào main;
        # sau đó xoá dòng continue-on-error để bắt buộc.
        continue-on-error: true
        uses: fsfe/reuse-action@v5
