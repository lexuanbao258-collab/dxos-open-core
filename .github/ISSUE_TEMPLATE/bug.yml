name: Bug report
description: Report behavior that differs from what is expected.
labels: []
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include logs or screenshots, but no tokens, passwords, or real user data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For example, v0.1.0 or a SHA on main.
