server:
  address: 127.0.0.1
  servlet:
    session:
      timeout: 30m
      cookie:
        name: __Host-DXOS-Portal
        http-only: true
        secure: true
        # The OIDC top-level GET callback needs the login transaction cookie.
        same-site: lax
        path: /
spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${PORTAL_OIDC_CLIENT_ID}
            client-secret: ${PORTAL_OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${PORTAL_OIDC_REDIRECT_URI}
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${PORTAL_OIDC_ISSUER_URI}
dxos:
  portal-bff:
    public-origin: ${PORTAL_PUBLIC_ORIGIN}
    backend-base-url: ${PORTAL_BACKEND_BASE_URL}
