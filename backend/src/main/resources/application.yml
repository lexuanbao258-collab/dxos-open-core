spring:
  application:
    name: dxos-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
    hibernate:
      ddl-auto: none

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: never

tricore:
  security:
    oidc:
      audience: ${OIDC_AUDIENCE}
      resource-client-id: ${OIDC_RESOURCE_CLIENT_ID}

# API explorer is local-only and opt-in. The Helpdesk MVP itself stays default-off.
dxos:
  openapi:
    enabled: ${DXOS_OPENAPI_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${dxos.openapi.enabled:false}
  swagger-ui:
    enabled: ${dxos.openapi.enabled:false}
    persist-authorization: false
