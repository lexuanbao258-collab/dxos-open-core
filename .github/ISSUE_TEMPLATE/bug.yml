name: Báo lỗi
description: Hệ thống chạy sai so với mong đợi.
labels: []
body:
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
      description: Kèm log hoặc ảnh. Không dán token, mật khẩu, dữ liệu người dùng thật.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Phiên bản hoặc commit
      description: Ví dụ v0.1.0 hoặc SHA trên main.
