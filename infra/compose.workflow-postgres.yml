services:
  workflow-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: workflow_test
      POSTGRES_USER: workflow_test
      POSTGRES_PASSWORD: ${WORKFLOW_LOCAL_DB_PASSWORD:?Set WORKFLOW_LOCAL_DB_PASSWORD}
    ports:
      - "127.0.0.1:55425:5432"
    volumes:
      - workflow-postgres-17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_test -d workflow_test"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  workflow-postgres-17-data:
