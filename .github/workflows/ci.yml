# Shared CI. The main branch requires backend, portal-bff, frontend, and repo-hygiene.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Parse PowerShell PKCE handoff script
        shell: pwsh
        working-directory: .
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            './scripts/poc/keycloak-auth-code-poc.ps1',
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'PKCE_POC_SYNTAX_PASS'
      - name: Remove prior test reports
        run: rm -rf build/test-results/test
      - name: Build and unit tests
        run: ./gradlew build --no-daemon --stacktrace --rerun-tasks
      - name: Confirm identity and gateway security suites executed
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("build/test-results/test")
          for simple in ("GatewayIdentityHandoffHttpTest",
                         "SpringSecurityCurrentPrincipalTest",
                         "WorkflowHttpExposureTest"):
              matches = list(root.glob("TEST-*." + simple + ".xml"))
              assert len(matches) == 1, (simple, len(matches))
              suite = ET.parse(matches[0]).getroot()
              values = {key: int(suite.attrib.get(key, "0"))
                        for key in ("tests", "failures", "errors", "skipped")}
              assert values["tests"] > 0 and all(
                  values[k] == 0 for k in ("failures", "errors", "skipped")
              ), (simple, values)
              print(simple, values)
          print("IDENTITY_GATEWAY_MOCKED_FILTER_HANDOFF_PASS")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  portal-bff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect portal-bff
        id: detect
        run: |
          if [ ! -d portal-bff ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::portal-bff/ is absent; application build is not applicable."
          elif [ -f portal-bff/build.gradle ] || [ -f portal-bff/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::portal-bff/ exists without a Gradle build file."
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test (uses the backend Gradle wrapper)
        if: steps.detect.outputs.present == 'true'
        run: ./backend/gradlew -p portal-bff build --no-daemon --stacktrace

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ ! -d frontend ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ is absent; application build is not applicable."
          elif [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::frontend/ exists without package.json and package-lock.json."
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, build and test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

  r23-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper before execution
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Java CycloneDX SBOMs
        run: |
          ./backend/gradlew -p backend cyclonedxBom --no-daemon
          ./backend/gradlew -p portal-bff cyclonedxBom --no-daemon
      - name: Generate npm CycloneDX SBOM
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file ../frontend-sbom.json
      - name: Validate licenses and generate notices
        run: |
          python3 scripts/r23-compliance.py \
            --backend backend/build/reports/cyclonedx/bom.json \
            --portal-bff portal-bff/build/reports/cyclonedx/bom.json \
            --frontend frontend-sbom.json \
            --output build/r23
      - name: Upload R23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r23-sbom-and-notices
          retention-days: 30
          path: |
            backend/build/reports/cyclonedx/bom.json
            portal-bff/build/reports/cyclonedx/bom.json
            frontend-sbom.json
            build/r23/THIRD-PARTY-NOTICES.md
            build/r23/license-inventory.json

  repo-hygiene:
    needs: [r23-compliance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce R23 in required repo-hygiene check
        env:
          R23_RESULT: ${{ needs.r23-compliance.result }}
        run: |
          if [ "$R23_RESULT" != "success" ]; then
            echo "::error::R23 compliance job: $R23_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore|ci|build)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must look like 'feat(workflow): add outbox event'. Got: $TITLE"
            exit 1
          fi
      - name: PR links an issue and stays small
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          if ! printf '%s' "$BODY" | grep -Eiq '(closes|fixes|refs) #[0-9]+'; then
            echo "::warning::PR description has no 'Closes #N'. Link the issue it completes."
          fi
          total=$(( ${ADDITIONS:-0} + ${DELETIONS:-0} ))
          if [ "$total" -gt 400 ]; then
            echo "::warning::PR changes $total lines (limit 400, lockfiles included). Consider splitting it."
          fi
      - name: Gradle wrapper is executable
        run: |
          mode=$(git ls-files -s backend/gradlew | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::backend/gradlew must be committed as executable: git update-index --chmod=+x backend/gradlew"
            exit 1
          fi
      - name: REUSE licensing check
        uses: fsfe/reuse-action@v5
